<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <script src="https://kit.fontawesome.com/011ed2dfc0.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-left">
           <button class="menu">
                <img src="menu.svg" alt="" class="menu">
            </button>
            <a href=""><img src="logo-youtube.png" class="youtube-logo" alt="Youtube logo"></a>

        </div>

        <form action="#" class="search-bar">
            <input type="search" placeholder="Search or ask a question" aria-label="search" class="search-input">
            <button type="submit" class="search-btn">
                <img src="magnify.svg" alt="search">
            </button>

            <button class="voice-search">
                <img src="voice.svg" alt="voice search">
            </button>
        </form>

        <div class="header-right">
            <button class="tags-btn">
                <img src="youtube wand.svg" alt="tags"> Tags
            </button>

            <button class="create-btn">
                <img src="add.svg" alt="upload video"> Create
            </button>

            <button>
                <img src="bell.svg" alt="notifications">
            </button>

            <button>
                <img src="canal profile.png" class="user-icon" alt="user">
            </button>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-section">
                <a href="#">
                    <div class="sidebar-button">
                        <span class="material-icons sidebar-icon">home</span>
                        <span>Home</span>
                    </div>
                </a>

                <div class="sidebar-button">
                    <a href="#">
                    <i class="fa-brands fa-youtube-shorts"></i>
                    <span>Shorts</span>
                    </a>
                </div>

                <div class="sidebar-button">
                    <a href="#">
                        <span class="material-icons">playlist_play</span>
                        <span>Deck</span>
                    </a>
                </div>
                <hr>

            <div class="sidebar-section">
                <div class="sidebar-button">
                    <a href="#">
                    <span>Subscriptions > </span>
                    <span class="material-icons">more_vert</span>
                    </a>
                </div>

                <div class="sidebar-button">
                    <a href="#">
                        <img src="http://unsplash.it/36/36?gravity=center" alt="" class="channel-icon">
                        Channel Name
                    </a>
                </div>


                 <div class="sidebar-button">
                    <a href="#">
                        <img src="http://unsplash.it/36/36?gravity=center" alt="" class="channel-icon">
                        Channel Name
                    </a>
                </div>

                <div class="sidebar-button">
                    <a href="#">
                        <img src="http://unsplash.it/36/36?gravity=center" alt="" class="channel-icon">
                        Channel Name
                    </a>
                </div>

                <div class="sidebar-button">
                    <a href="#">
                        <img src="http://unsplash.it/36/36?gravity=center" alt="" class="channel-icon">
                        Channel Name
                    </a>
                </div>

                <div class="sidebar-button">
                    <a href="#">
                        <img src="http://unsplash.it/36/36?gravity=center" alt="" class="channel-icon">
                        Channel Name
                    </a>
                </div>
                
            </div>

            </div>
        </aside>

        <div class="video-section">
            <section class="filters"></section>
            <div class="video-container">
                <a href="#" class="thumbnail">
                    <img src="http://unsplash.it/250/150?gravity=center" alt="" class="thumbnail-img">
                </a>
                <div class="video-bottom-section">
                    <a href="#">
                        <img src="http://unsplash.it/36/36?gravity=center" alt="" class="thumbnail-img"" alt="" class="channel-icon">
                    </a>
                    <div class="video-details">
                        <a href="#" class="video-title">Video Title</a>
                        <span class="material-icons">more_vert</span>
                        <div class="metadata">
                            <a href="#" class="vide-channel-name">Channel Name
                            <span class="material-icons">check_circle</span>
                            </a>
                            <span class="material-icons">arrow_right</span>
                             <span>20K</span>
                             <span>2h ago</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
